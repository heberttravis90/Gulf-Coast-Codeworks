name: Apply 3D Website Update

on:
  push:
    paths:
      - '.github/workflows/apply-3d-website-update.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply website update
        run: python scripts/apply_3d_website_update.py

      - name: Commit updated website
        run: |
          if git diff --quiet -- index.html; then
            echo "No website changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add custom 3D design services"
          git push
