name: Build PayForecast Floot AAB

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/payforecast-temp-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download Floot mobile project
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://a1c1365c-7790-4032-b223-91efe3aed6d4.sandbox.floot.app/_cdn/static/fce1625d-0e21-4267-b064-475db9ac3921-mobile-builds-1790037080671416b5534-606e-4db7-9ea8-4c36a55e55ca.zip" \
            --output payforecast-mobile.zip
          unzip -q payforecast-mobile.zip -d mobile
          test -f mobile/android/gradlew
          test -f mobile/pnpm-lock.yaml

      - name: Pull latest PayForecast web build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse
          import re

          base = "https://payforecast-gccw.floot.app"
          public = Path("mobile/android/app/src/main/assets/public")
          public.mkdir(parents=True, exist_ok=True)

          # Remove the old compiled Floot bundle but keep Capacitor/native helper files.
          assets = public / "_assets"
          if assets.exists():
              for p in sorted(assets.rglob("*"), reverse=True):
                  if p.is_file() or p.is_symlink():
                      p.unlink()
                  elif p.is_dir():
                      p.rmdir()
          assets.mkdir(parents=True, exist_ok=True)

          seen = set()
          queue = ["/"]

          asset_re = re.compile(r'''(?:"|')((?:https://payforecast-gccw\.floot\.app)?/(?:_assets|_cdn)/[^"'\\\s<>)]+)''')
          root_asset_re = re.compile(r'''(?:"|')(/(?:floot-push-sw\.js|OneSignalSDKWorker\.js))(?:"|')''')

          def fetch(path):
              url = path if path.startswith("http") else base + path
              req = Request(url, headers={"User-Agent": "PayForecast-Android-Build/1.0"})
              with urlopen(req, timeout=30) as r:
                  return r.read(), r.headers.get_content_type()

          while queue:
              item = queue.pop(0)
              parsed = urlparse(item)
              path = parsed.path if parsed.scheme else item.split("?",1)[0]
              if path in seen:
                  continue
              seen.add(path)

              data, content_type = fetch(item)

              if path == "/":
                  target = public / "index.html"
              else:
                  target = public / path.lstrip("/")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

              if content_type.startswith("text/") or path.endswith((".js",".css",".html",".json")):
                  text = data.decode("utf-8", errors="ignore")
                  for match in asset_re.finditer(text):
                      ref = match.group(1)
                      if ref.startswith(base):
                          ref = ref[len(base):]
                      ref = ref.split("#",1)[0]
                      if ref not in seen:
                          queue.append(ref)
                  for match in root_asset_re.finditer(text):
                      ref = match.group(1)
                      if ref not in seen:
                          queue.append(ref)

          print("Downloaded latest production bundle:")
          for p in sorted(public.rglob("*")):
              if p.is_file() and (p.name == "index.html" or "_assets" in p.parts or "_cdn" in p.parts):
                  print(p)
          PY

          grep -q "Add pay period" mobile/android/app/src/main/assets/public/_assets/*.js
          grep -q "Standard 80 hrs" mobile/android/app/src/main/assets/public/_assets/*.js\n          grep -q "Know what you can actually keep" mobile/android/app/src/main/assets/public/_assets/*.js\n          grep -q "Use recommended" mobile/android/app/src/main/assets/public/_assets/*.js

      - name: Set Android version
        shell: bash
        run: |
          sed -i 's/versionCode [0-9][0-9]*/versionCode 3/' mobile/android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.2"/' mobile/android/app/build.gradle
          grep -n "versionCode\|versionName" mobile/android/app/build.gradle

      - name: Install mobile dependencies
        shell: bash
        working-directory: mobile
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sed -i 's#android.aapt2FromMavenOverride=.*#android.aapt2FromMavenOverride=/usr/local/lib/android/sdk/build-tools/36.0.0/aapt2#' mobile/android/gradle.properties
          test -x /usr/local/lib/android/sdk/build-tools/36.0.0/aapt2

      - name: Build unsigned release bundle
        shell: bash
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:bundleRelease -PflootNoMinify
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: payforecast-1.0.2-unsigned-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
