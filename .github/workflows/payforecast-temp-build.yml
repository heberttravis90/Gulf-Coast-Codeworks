name: Temporary PayForecast Android Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/payforecast-temp-build.yml"
      - "payforecast-build/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/payforecast-temp-build.yml"
      - "payforecast-build/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble Android source
        shell: bash
        run: |
          cat payforecast-build/chunks/00 payforecast-build/chunks/01 payforecast-build/chunks/02 payforecast-build/chunks/03 payforecast-build/chunks/04 payforecast-build/chunks/05 payforecast-build/chunks/06 payforecast-build/chunks/07 payforecast-build/chunks/08 > android-src.b64
          base64 --decode android-src.b64 > android-src.zip
          echo "e57abc0c71b3f77cbf04df41a28451d14d56bae45151870730011d536c1402ab  android-src.zip" | sha256sum --check
          unzip -q android-src.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release app bundle
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: payforecast-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
