name: Build PayForecast Floot AAB

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/payforecast-temp-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download Floot mobile project
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://a1c1365c-7790-4032-b223-91efe3aed6d4.sandbox.floot.app/_cdn/static/fce1625d-0e21-4267-b064-475db9ac3921-mobile-builds-1790037080671416b5534-606e-4db7-9ea8-4c36a55e55ca.zip" \
            --output payforecast-mobile.zip
          unzip -q payforecast-mobile.zip -d mobile
          test -f mobile/android/gradlew
          test -f mobile/pnpm-lock.yaml

      - name: Install mobile dependencies
        shell: bash
        working-directory: mobile
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sed -i 's#android.aapt2FromMavenOverride=.*#android.aapt2FromMavenOverride=/usr/local/lib/android/sdk/build-tools/36.0.0/aapt2#' mobile/android/gradle.properties
          test -x /usr/local/lib/android/sdk/build-tools/36.0.0/aapt2

      - name: Build unsigned release bundle
        shell: bash
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:bundleRelease -PflootNoMinify
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: payforecast-floot-unsigned-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
